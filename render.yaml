# Render Blueprint: tells Render how to host the app. See README "Put it online".
# Values marked "sync: false" are secrets you type into the Render dashboard;
# they are never stored in this repo.
services:
  - type: web
    name: complaint-agent
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEMO_PASSCODE          # give this to the people who may use the demo page
        sync: false
      - key: N8N_OWNER_EMAIL        # your login for the n8n editor
        sync: false
      - key: N8N_OWNER_PASSWORD
        sync: false
      - key: N8N_ENCRYPTION_KEY     # encrypts stored credentials; Render makes one up
        generateValue: true
      - key: PORT
        value: "5678"
      - key: N8N_PROXY_HOPS         # n8n sits behind Render's proxy
        value: "1"
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: "false"
      - key: N8N_PERSONALIZATION_ENABLED
        value: "false"
      # The free plan has 512 MB of memory and a slow CPU. n8n runs two Node
      # processes (n8n itself and the task runner that executes Code steps),
      # so both get a memory cap, and the slow start gets longer time limits.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=300"
      - key: N8N_RUNNERS_MAX_OLD_SPACE_SIZE
        value: "128"
      - key: N8N_RUNNERS_GRANT_TOKEN_TTL
        value: "120"
      - key: DB_PING_TIMEOUT_MS
        value: "15000"
